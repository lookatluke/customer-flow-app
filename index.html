<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS standalone / viewer niceties (harmless on other platforms) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1117" />
    <title>Customer Flow</title>
  </head>
  <body>
    <!--
      iOS OPEN GUIDE (static — visible even WITHOUT JavaScript).
      On iOS, the Files/Telegram viewer (Quick Look / WebKit file://) does NOT
      execute JavaScript, so this React app never renders and the user sees
      ONLY this banner. On desktop/Android the app renders into #root and a
      few lines of inline JS below remove this banner, so it is invisible to
      everyone except the iPhone user who needs it.
    -->
    <div id="ios-guide" style="position:fixed;inset:0;z-index:99999;background:#0f1117;color:#c8d0dc;font:15px/1.6 system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center">
      <div style="font-size:40px;margin-bottom:16px">📱</div>
      <div style="font-size:18px;font-weight:700;color:#f0f4f8;margin-bottom:8px">Customer Flow</div>
      <div style="color:#7a8494;margin-bottom:24px;font-size:14px">이 화면이 보인다면 아이폰에서<br/>아래 방법으로 열어야 작동합니다.</div>
      <div style="background:#181c24;border:1px solid #2a3040;border-radius:12px;padding:20px 24px;max-width:440px;text-align:left;font-size:14px">
        <div style="color:#4f8ef7;font-weight:600;margin-bottom:12px">개통 방법 (3단계)</div>
        <div style="margin-bottom:10px"><strong>1.</strong> App Store에서 <strong>Documents</strong> 앱 설치<br/><span style="color:#7a8494;font-size:13px">(Readdle — 무료)</span></div>
        <div style="margin-bottom:10px"><strong>2.</strong> Documents로 이 HTML 파일을 <strong>이동</strong><br/><span style="color:#7a8494;font-size:13px">파일 공유 → Documents로 이동</span></div>
        <div><strong>3.</strong> Documents에서 이 파일을 <strong>탭</strong><br/><span style="color:#7a8494;font-size:13px">이제 앱이 정상 작동합니다</span></div>
      </div>
      <div style="color:#7a8494;font-size:12px;margin-top:24px;max-width:380px">PC · 윈도우 · 안드로이드는 별도 설치 없이<br/>이 파일을 브라우저로 바로 열면 됩니다.</div>
    </div>

    <!-- App root (React renders here; removes #ios-guide on success) -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
